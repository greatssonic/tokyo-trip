let activeTab='common';

function showToast(text){
  const t=document.getElementById('toast');
  t.textContent='📋 '+text+' 복사됨!';
  t.style.display='block';
  setTimeout(()=>t.style.display='none',1500);
}

function copyPhrase(jp){
  if(navigator.clipboard)navigator.clipboard.writeText(jp);
  showToast(jp);
}

let currentAudio=null;
function speakJP(jp,btn){
  if(currentAudio){currentAudio.pause();currentAudio=null;document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));}
  const url='https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q='+encodeURIComponent(jp);
  const a=new Audio(url);
  currentAudio=a;
  btn.classList.add('speaking');
  a.onended=()=>{btn.classList.remove('speaking');currentAudio=null;};
  a.onerror=()=>{btn.classList.remove('speaking');currentAudio=null;
    const u=new SpeechSynthesisUtterance(jp);u.lang='ja-JP';u.rate=0.8;
    window.speechSynthesis.speak(u);};
  a.play();
}

function renderPhrase(p){
  const escaped=p.jp.replace(/'/g,"\\'");
  return`<div class="phrase">
    <div class="phrase-content" onclick="copyPhrase('${escaped}')">
      <div class="phrase-jp">${p.jp}</div>
      <div class="phrase-read">${p.read}</div>
      <div class="phrase-kr">${p.kr}</div>
      ${p.note?'<div class="phrase-note">'+p.note+'</div>':''}
    </div>
    <button class="speak-btn" onclick="speakJP('${escaped}',this)" title="발음 듣기">🔊</button>
  </div>`;
}

function renderMenu(m){
  return`<div class="menu-item">
    <div class="menu-left">
      <div class="menu-jp">${m.jp}</div>
      <div class="menu-read">${m.read}</div>
      <div class="menu-kr">${m.kr}</div>
    </div>
    <div class="menu-price">${m.price}</div>
  </div>`;
}

function render(){
  const tabBar=document.getElementById('tabBar');
  tabBar.innerHTML=tabs.map(t=>`<div class="tab ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  tabBar.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click',()=>{activeTab=el.dataset.tab;render()});
  });

  const sec=document.getElementById('sections');
  const d=data[activeTab];
  if(!d){sec.innerHTML='';return;}

  let html='';

  if(d.groups){
    html+=d.groups.map(g=>`<div class="card">
      <div class="card-header">${g.name}</div>
      <div class="card-body">${g.phrases.map(renderPhrase).join('')}</div>
    </div>`).join('');
  }

  if(d.restaurant){
    html+=`<div class="card">
      <div class="rest-header"><div class="rest-name">${d.restaurant.name}</div><div class="rest-info">${d.restaurant.info}</div></div>
      <div class="card-body">
        ${d.warn?'<div class="preg-warn">🤰 '+d.warn+'</div>':''}
        <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px">📋 메뉴</div>
        ${d.menu.map(renderMenu).join('')}
        ${d.extra?'<div class="divider"></div><div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px">🗣️ 유용한 표현</div>'+d.extra.map(renderPhrase).join(''):''}
      </div>
    </div>`;
  }

  sec.innerHTML=html;
}

render();
</script>
