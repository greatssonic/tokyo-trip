.header{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}

.progress-card{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border-radius:10px;padding:8px 10px}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.progress-label{font-size:12px;font-weight:600}
.progress-pct{font-size:18px;font-weight:700}
.progress-count{font-size:10px;opacity:.8}
.progress-bar-bg{height:6px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(to right,#fde047,#fff);transition:width .5s;border-radius:999px}
.container{max-width:600px;margin:0 auto;padding:12px}
.category{background:#fff;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.cat-chevron{transition:transform .2s;color:#9ca3af}
.cat-chevron.open{transform:rotate(180deg)}
.cat-body{display:none;padding:8px 12px 12px}
.cat-body.open{display:block}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;background:#f9fafb;border:2px solid #e5e7eb;margin-bottom:6px;cursor:pointer;user-select:none;transition:all .15s}
.item:active{transform:scale(.98)}
.item.checked{background:#f0fdf4;border-color:#86efac}
.item-box{width:22px;height:22px;border-radius:50%;border:2px solid #d1d5db;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.item.checked .item-box{background:#22c55e;border-color:#22c55e}
.item-box svg{opacity:0;transition:opacity .15s}.item.checked .item-box svg{opacity:1}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:600;color:#1f2937;margin-bottom:1px}
.item.checked .item-name{color:#6b7280;text-decoration:line-through}
.item-desc{font-size:11px;color:#6b7280;line-height:1.4}
.price-compare{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.price-jp{background:#fef2f2;color:#dc2626;font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #fecaca}
.price-kr{background:#dbeafe;color:#1e40af;font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #bfdbfe}
.price-save{background:#d1fae5;color:#065f46;font-weight:700;font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid #6ee7b7}
.price-same{background:#fef3c7;color:#92400e;font-weight:700;font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid #fde68a}
.kr-link{display:inline-flex;align-items:center;gap:2px;background:#f43f5e;color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;text-decoration:none;margin-left:2px}

.badge-recommend{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.badge-option{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb}
.tip-box{background:#fff7ed;border:2px solid #fdba74;border-radius:12px;padding:12px;margin-bottom:12px;font-size:12px;color:#92400e;line-height:1.6}

function load(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)checked=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checked))}catch(e){}}

function checkSvg(){return'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'}
function chevSvg(){return'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>'}

const allItems=categories.flatMap(c=>c.items);
let openCats={};

function toggle(id){
  if(checked[id])delete checked[id];else checked[id]=true;
  save();render();
}
function toggleCat(idx){
  openCats[idx]=!openCats[idx];render();
}

function render(){
  const done=allItems.filter(i=>checked[i.id]).length;
  const total=allItems.length;
  const pct=Math.round(done/total*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('cnt').textContent='('+done+'/'+total+')';
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('completeMsg').innerHTML=pct===100?'<div class="complete-msg">🎉 쇼핑 완료! 수고했어요! 🎉</div>':'';

  const c=document.getElementById('listContainer');
  c.innerHTML=categories.map((cat,idx)=>{
    const isOpen=openCats[idx]!==false;
    const catDone=cat.items.filter(i=>checked[i.id]).length;
    return`<div class="category">
      <div class="cat-header" data-cat="${idx}">
        <div class="cat-title">${cat.emoji} ${cat.title} <span class="cat-count">${catDone}/${cat.items.length}</span></div>
        <div class="cat-chevron ${isOpen?'open':''}">${chevSvg()}</div>
      </div>
      <div class="cat-body ${isOpen?'open':''}">
        ${cat.items.map(item=>{
          const ic=!!checked[item.id];
          const badgeCls=item.badge==='must'?'badge-must':item.badge==='recommend'?'badge-recommend':'badge-option';
          const badgeText=item.badge==='must'?'필수':item.badge==='recommend'?'추천':'선택';
          const saveTag=item.same?`<span class="price-same">비슷</span>`:(item.save?`<span class="price-save">${item.save}</span>`:'');
          const coupangLink=item.coupang?`<a class="kr-link" href="${item.coupang}" target="_blank" onclick="event.stopPropagation()">쿠팡 비교</a>`:'';
          return`<div class="item ${ic?'checked':''}" data-id="${item.id}">
            <div class="item-box">${checkSvg()}</div>
            <div class="item-info">
              <div class="item-name"><span class="item-badge ${badgeCls}">${badgeText}</span>${item.name}</div>
              <div class="item-desc">${item.desc}</div>
              <div class="price-compare">
                <span class="price-jp">🇯🇵 ${item.jpPrice}</span>
                <span class="price-kr">🇰🇷 ${item.krPrice}</span>
                ${saveTag}
                ${coupangLink}
              </div>
            </div>
          </div>`
        }).join('')}
      </div>
    </div>`
  }).join('');

  c.querySelectorAll('.cat-header').forEach(el=>{
    el.addEventListener('click',()=>toggleCat(parseInt(el.dataset.cat)));
  });
  c.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click',()=>toggle(el.dataset.id));
  });
}

load();render();
</script>
