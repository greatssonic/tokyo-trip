.speak-btn:active{transform:scale(.88);background:#1d4ed8}
.speak-btn.speaking{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse-speak 1s infinite}
@keyframes pulse-speak{0%,100%{opacity:1}50%{opacity:.6}}
.phrase-jp{font-size:18px;font-weight:700;color:#1d4ed8;margin-bottom:2px}
.phrase-read{font-size:13px;color:#6b7280;margin-bottom:2px}
.phrase-kr{font-size:13px;color:#1f2937;font-weight:600}
.phrase-note{font-size:10px;color:#9ca3af;margin-top:2px}

.tip b{color:#c2410c}

let activeTab='common';

function showToast(text){
  const t=document.getElementById('toast');
  t.textContent='📋 '+text+' 복사됨!';
  t.style.display='block';
  setTimeout(()=>t.style.display='none',1500);
}

function copyPhrase(jp){
  if(navigator.clipboard)navigator.clipboard.writeText(jp);
  showToast(jp);
}

let jaVoice=null;
function loadVoice(){
  const voices=window.speechSynthesis.getVoices();
  const ja=voices.filter(v=>v.lang.startsWith('ja'));
  jaVoice=ja.find(v=>/female|woman|haruka|kyoko|o-ren/i.test(v.name))||ja.find(v=>v.localService)||ja[0]||null;
}
window.speechSynthesis.onvoiceschanged=loadVoice;
loadVoice();

function speakJP(jp,btn){
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  const u=new SpeechSynthesisUtterance(jp);
  u.lang='ja-JP';
  u.rate=0.75;
  u.pitch=1.1;
  if(jaVoice)u.voice=jaVoice;
  btn.classList.add('speaking');
  u.onend=()=>btn.classList.remove('speaking');
  u.onerror=()=>btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

function renderPhrase(p){
  const escaped=p.jp.replace(/'/g,"\\'");
  return`<div class="phrase">
    <div class="phrase-content" onclick="copyPhrase('${escaped}')">
      <div class="phrase-jp">${p.jp}</div>
      <div class="phrase-read">${p.read}</div>
      <div class="phrase-kr">${p.kr}</div>
      ${p.note?'<div class="phrase-note">💡 '+p.note+'</div>':''}
    </div>
    <button class="speak-btn" onclick="speakJP('${escaped}',this)" title="발음 듣기">🔊</button>
  </div>`;
}

function renderRoute(r){
  return`<div class="route-card">
    <div class="route-title">📍 ${r.title}</div>
    ${r.steps.map(s=>`<div class="route-step">
      <div class="route-icon ${s.icon}">${s.icon==='train'?'🚃':s.icon==='walk'?'🚶':s.icon==='taxi'?'🚕':'🚌'}</div>
      <div class="route-detail"><b>${s.text}</b><br><span class="route-time">${s.time}</span></div>
    </div>`).join('')}
  </div>`;
}

function render(){
  const tabBar=document.getElementById('tabBar');
  tabBar.innerHTML=tabs.map(t=>`<div class="tab ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  tabBar.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click',()=>{activeTab=el.dataset.tab;render()});
  });

  const sec=document.getElementById('sections');
  const d=data[activeTab];
  if(!d){sec.innerHTML='';return;}

  let html='';
  d.groups.forEach(g=>{
    html+=`<div class="card">
      <div class="card-header">${g.name}</div>
      <div class="card-body">
        ${g.tip?'<div class="tip">💡 <b>팁:</b> '+g.tip+'</div>':''}
        ${g.warn?'<div class="warn-box">⚠️ '+g.warn+'</div>':''}
        ${g.phrases?g.phrases.map(renderPhrase).join(''):''}
        ${g.routes?g.routes.map(renderRoute).join(''):''}
      </div>
    </div>`;
  });

  sec.innerHTML=html;
}

render();
</script>
